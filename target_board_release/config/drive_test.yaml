# Conservative local drive-test values. Measure the wheel diameter and track
# width before using odometry or raising the speed limits.
base_drive_node:
  ros__parameters:
    left_motor_id: 1
    right_motor_id: 2
    left_motor_sign: 1
    right_motor_sign: -1
    wheel_radius_m: 0.04
    wheel_separation_m: 0.30
    motor_output_to_wheel_ratio: 1.0
    max_wheel_speed_m_s: 0.12
    max_linear_speed_m_s: 0.005
    max_angular_speed_rad_s: 0.03
    max_linear_accel_m_s2: 0.05
    max_angular_accel_rad_s2: 0.50
    minimum_inner_wheel_ratio: 0.50
    command_timeout_ms: 200
    can_tx_topic: /can/tx
    can_rx_topic: /can/rx

slcan_can_bridge_node:
  ros__parameters:
    serial_port: ""
    serial_baud_rate: 115200
    can_bitrate: 1000000
    auto_open: true
    can_tx_topic: /can/tx
    can_rx_topic: /can/rx

crawling_robot_monitor:
  ros__parameters:
    imu_topic: /imu/data
    profile_topic: /laser_profile/frame
    cmd_vel_topic: /cmd_vel
    max_linear_speed_m_s: 0.005
    max_angular_speed_rad_s: 0.03
    max_linear_accel_m_s2: 0.05
    max_angular_accel_rad_s2: 0.50
    max_wheel_speed_m_s: 0.12
    minimum_inner_wheel_ratio: 0.50
    can_bitrate: 1000000
    open_sensor_windows: false
